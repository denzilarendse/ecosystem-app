name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Require Android API 36
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle || true
          grep -E 'compileSdkVersion = 36|targetSdkVersion = 36' android/variables.gradle
      - name: Build Android APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CareerLaunch-SA-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
